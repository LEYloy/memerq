<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Управление ботом</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #101114;
    --card: #1a1c21;
    --card2: #1f2126;
    --border: #2a2c33;
    --text: #ffffff;
    --muted: #8b8d94;
    --accent: #34c759;
    --blue: #3390ec;
    --red: #e05353;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 78px;
  }
  a { color: inherit; }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px; gap: 10px;
  }
  .header-left { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
  .star-badge {
    width: 30px; height: 30px; border-radius: 9px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .bot-pill {
    display: flex; align-items: center; gap: 6px; background: var(--card);
    border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px;
    font-size: 14px; font-weight: 600; color: var(--accent);
  }

  .section-title {
    display: flex; align-items: center; gap: 6px;
    color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .03em;
    text-transform: uppercase; margin: 6px 16px 12px;
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px; cursor: pointer; user-select: none; transition: background .12s;
  }
  .card:active { background: var(--card2); }
  .card-icon { font-size: 22px; margin-bottom: 20px; display: block; }
  .card-title { font-weight: 700; font-size: 15px; margin-bottom: 3px; }
  .card-sub { color: var(--muted); font-size: 12.5px; line-height: 1.3; }

  .screen { padding: 4px 16px 24px; }
  .back-row { display: flex; align-items: center; gap: 8px; padding: 10px 0 14px; }
  .back-btn { font-size: 15px; color: var(--accent); font-weight: 600; cursor: pointer; }
  .screen h1 { font-size: 20px; margin: 0 0 4px; }
  .hint { color: var(--muted); font-size: 13px; margin-bottom: 18px; line-height: 1.45; }

  label { display: block; font-size: 13px; color: var(--muted); margin: 16px 0 6px; }
  input[type=text], input[type=number], textarea {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 15px; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 90px; }
  .counter { text-align: right; font-size: 12px; color: var(--muted); margin-top: 4px; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 6px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .stat-num { font-size: 22px; font-weight: 800; }
  .stat-label { color: var(--muted); font-size: 12.5px; margin-top: 2px; }

  .colors { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .color-opt {
    padding: 12px; border-radius: 10px; text-align: center; font-size: 14px; font-weight: 500;
    color: #fff; border: 2px solid transparent; cursor: pointer;
  }
  .color-opt.selected { border-color: #fff; }

  .note {
    background: rgba(255,255,255,0.05); border-radius: 10px; padding: 12px;
    font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 20px;
  }
  .row { display: flex; gap: 10px; margin-top: 20px; }
  .btn { flex: 1; padding: 14px; border-radius: 10px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-secondary { background: #2a2c33; color: #fff; }
  .btn-danger { background: #3a2a2a; color: #ff6b6b; }
  .status { text-align: center; font-size: 13px; color: var(--muted); margin-top: 12px; min-height: 16px; }

  .preview-btn {
    width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 16px; font-weight: 500;
    color: #fff; margin-bottom: 8px; cursor: default;
  }
  .img-preview {
    width: 100%; aspect-ratio: 16/9; border-radius: 12px; background: var(--card);
    border: 1px solid var(--border); object-fit: cover; margin-top: 10px; display: none;
  }
  .list-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .list-row:last-child { border-bottom: none; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin: 4px 0; }
  .bar-track { flex: 1; height: 8px; border-radius: 4px; background: var(--card2); overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); }

  .nav {
    position: fixed; bottom: 0; left: 0; right: 0; background: #16171b;
    border-top: 1px solid var(--border); display: flex; padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--muted); font-size: 11px; cursor: pointer; padding: 4px;
  }
  .nav-item .nav-icon { font-size: 20px; }
  .nav-item.active { color: var(--accent); }

  .loading { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  .locked { text-align: center; padding: 60px 24px; color: var(--muted); font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

<div id="app"></div>

<div class="nav" id="nav">
  <div class="nav-item" data-tab="overview"><span class="nav-icon">▦</span>Обзор</div>
  <div class="nav-item" data-tab="stats"><span class="nav-icon">📶</span>Статистика</div>
  <div class="nav-item" data-tab="withdraw"><span class="nav-icon">💳</span>Вывод</div>
  <div class="nav-item" data-tab="profile"><span class="nav-icon">👤</span>Профиль</div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor?.('#101114'); tg.setBackgroundColor?.('#101114'); }

const app = document.getElementById('app');
const navEl = document.getElementById('nav');
let currentTab = 'overview';
let currentScreen = null; // sub-screen slug, null = grid

const CARDS = [
  { id: 'texts',   icon: '📝', title: 'Тексты',    sub: 'Сообщения бота' },
  { id: 'buttons', icon: '🔘', title: 'Кнопки',     sub: 'Цвет и текст' },
  { id: 'images',  icon: '🖼️', title: 'Картинки',   sub: 'Оформление разделов' },
  { id: 'broadcast', icon: '📢', title: 'Рассылка', sub: 'Пост всем пользователям' },
  { id: 'referrals', icon: '👥', title: 'Рефералы', sub: 'Процент и статистика' },
  { id: 'pricing', icon: '📈', title: 'Наценки',    sub: 'Курсы и надбавки' },
  { id: 'discount', icon: '🏷️', title: 'Скидки',    sub: 'Скидка на товар' },
  { id: 'channel', icon: '📌', title: 'Обязательный канал', sub: 'Подписка перед покупкой' },
];

function api(path, method = 'GET', body) {
  const headers = { 'X-Init-Data': tg?.initData || '' };
  const opts = { method, headers };
  if (body !== undefined) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  return fetch('/api' + path, opts).then(async r => {
    const data = await r.json().catch(() => ({ ok: false, error: 'bad_json' }));
    if (!r.ok || !data.ok) throw new Error(data.error || ('http_' + r.status));
    return data;
  });
}

function upload(file) {
  const fd = new FormData();
  fd.append('file', file);
  return fetch('/api/upload', { method: 'POST', headers: { 'X-Init-Data': tg?.initData || '' }, body: fd })
    .then(async r => {
      const data = await r.json().catch(() => ({ ok: false }));
      if (!r.ok || !data.ok) throw new Error(data.error || 'upload_failed');
      return data;
    });
}

function el(html) {
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstElementChild;
}

function setNav() {
  navEl.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.tab === currentTab && !currentScreen));
}

navEl.querySelectorAll('.nav-item').forEach(n => {
  n.addEventListener('click', () => { currentTab = n.dataset.tab; currentScreen = null; render(); });
});

function backRow(title) {
  return `<div class="back-row"><span class="back-btn" id="backBtn">‹ Назад</span></div><h1>${title}</h1>`;
}

function wireBack() {
  document.getElementById('backBtn')?.addEventListener('click', () => { currentScreen = null; render(); });
}

// ---------------- OVERVIEW (grid) ----------------
async function renderOverview() {
  let profile = { bot_username: '' };
  try { profile = await api('/overview'); } catch (e) {}
  app.innerHTML = `
    <div class="header">
      <div class="header-left"><div class="star-badge">⭐</div>Звёзды</div>
      <div class="bot-pill">⭐ @${profile.bot_username || '...'}</div>
    </div>
    <div class="section-title">📈 Управление ботом</div>
    <div class="grid" id="cardGrid"></div>
  `;
  const grid = document.getElementById('cardGrid');
  CARDS.forEach(c => {
    const card = el(`<div class="card"><span class="card-icon">${c.icon}</span>
      <div class="card-title">${c.title}</div><div class="card-sub">${c.sub}</div></div>`);
    card.addEventListener('click', () => { currentScreen = c.id; render(); });
    grid.appendChild(card);
  });
}

// ---------------- TEXTS ----------------
async function renderTexts() {
  app.innerHTML = `<div class="screen">${backRow('Тексты')}
    <div class="hint">Тексты, которые бот присылает пользователям. Можно использовать теги &lt;b&gt;, &lt;i&gt;.</div>
    <label>Текст /start</label>
    <textarea id="tStart"></textarea>
    <label>Вопрос "кому отправить подарок?"</label>
    <textarea id="tBuy"></textarea>
    <div class="row"><button class="btn btn-save" id="save">Сохранить</button></div>
    <div class="status" id="status"></div></div>`;
  wireBack();
  const { texts } = await api('/texts');
  document.getElementById('tStart').value = texts.start || '';
  document.getElementById('tBuy').value = texts.buy_prompt || '';
  document.getElementById('save').addEventListener('click', async () => {
    const status = document.getElementById('status');
    status.textContent = 'Сохраняю...';
    try {
      await api('/texts', 'POST', { texts: {
        start: document.getElementById('tStart').value,
        buy_prompt: document.getElementById('tBuy').value,
      }});
      status.textContent = 'Сохранено ✓';
      tg?.HapticFeedback?.notificationOccurred('success');
    } catch (e) { status.textContent = 'Ошибка: ' + e.message; }
  });
}

// ---------------- BUTTONS ----------------
async function renderButtons() {
  app.innerHTML = `<div class="screen">${backRow('Кнопки')}
    <div class="hint">Текст, цвет и Premium-эмодзи кнопки товара (Bot API 9.4).</div>
    <button class="preview-btn" id="preview" style="background:#3a3d44;">Кнопка</button>
    <label>Текст кнопки</label>
    <input type="text" id="btnText" maxlength="64">
    <div class="counter"><span id="charCount">0</span>/64</div>
    <label>Цвет кнопки</label>
    <div class="colors">
      <div class="color-opt selected" data-style="" data-color="#3a3d44" style="background:#3a3d44;">Обычный</div>
      <div class="color-opt" data-style="primary" data-color="#3390ec" style="background:#3390ec;">Синий</div>
      <div class="color-opt" data-style="success" data-color="#34c759" style="background:#34c759;">Зелёный</div>
      <div class="color-opt" data-style="danger" data-color="#e05353" style="background:#e05353;">Красный</div>
    </div>
    <label>Premium-эмодзи ID (необязательно)</label>
    <input type="text" id="premiumEmoji" placeholder="5373230968943420212">
    <div class="note">⚠️ Эмодзи покажется только при активной Telegram Premium у владельца бота. Цвет виден только в клиентах после 9 февраля 2026.</div>
    <div class="row"><button class="btn btn-save" id="save">Сохранить</button></div>
    <div class="status" id="status"></div></div>`;
  wireBack();

  const { button } = await api('/buttons');
  const textInput = document.getElementById('btnText');
  const preview = document.getElementById('preview');
  const charCount = document.getElementById('charCount');
  const premiumInput = document.getElementById('premiumEmoji');
  let selectedStyle = button.style || '';
  let selectedColor = { primary: '#3390ec', success: '#34c759', danger: '#e05353' }[button.style] || '#3a3d44';

  textInput.value = button.text || '';
  premiumInput.value = button.icon_custom_emoji_id || '';
  document.querySelectorAll('.color-opt').forEach(o => o.classList.toggle('selected', o.dataset.style === selectedStyle));

  function updatePreview() {
    preview.textContent = textInput.value || 'Кнопка';
    preview.style.background = selectedColor;
    charCount.textContent = textInput.value.length;
  }
  textInput.addEventListener('input', updatePreview);
  document.querySelectorAll('.color-opt').forEach(elm => {
    elm.addEventListener('click', () => {
      document.querySelectorAll('.color-opt').forEach(o => o.classList.remove('selected'));
      elm.classList.add('selected');
      selectedStyle = elm.dataset.style;
      selectedColor = elm.dataset.color;
      updatePreview();
    });
  });
  updatePreview();

  document.getElementById('save').addEventListener('click', async () => {
    const status = document.getElementById('status');
    status.textContent = 'Сохраняю...';
    try {
      await api('/buttons', 'POST', {
        text: textInput.value.trim(),
        style: selectedStyle || null,
        icon_custom_emoji_id: premiumInput.value.trim(),
      });
      status.textContent = 'Сохранено — кнопка в боте обновлена ✓';
      tg?.HapticFeedback?.notificationOccurred('success');
    } catch (e) { status.textContent = 'Ошибка: ' + e.message; }
  });
}

// ---------------- IMAGES ----------------
async function renderImages() {
  app.innerHTML = `<div class="screen">${backRow('Картинки')}
    <div class="hint">Картинка, которая уходит перед сообщением /start. Вставьте ссылку или загрузите файл.</div>
    <label>URL картинки</label>
    <input type="text" id="imgUrl" placeholder="https://...">
    <img class="img-preview" id="imgPreview">
    <label>Или загрузить файл</label>
    <input type="file" id="imgFile" accept="image/*">
    <div class="row"><button class="btn btn-save" id="save">Сохранить</button></div>
    <div class="status" id="status"></div></div>`;
  wireBack();
  const { images } = await api('/images');
  const urlInput = document.getElementById('imgUrl');
  const preview = document.getElementById('imgPreview');
  urlInput.value = images.start || '';
  function showPreview() {
    if (urlInput.value) { preview.src = urlInput.value; preview.style.display = 'block'; }
    else preview.style.display = 'none';
  }
  showPreview();
  urlInput.addEventListener('input', showPreview);
  document.getElementById('imgFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const status = document.getElementById('status');
    status.textContent = 'Загружаю...';
    try {
      const { url } = await upload(file);
      urlInput.value = url;
      showPreview();
      status.textContent = 'Файл загружен, не забудьте сохранить';
    } catch (err) { status.textContent = 'Ошибка загрузки: ' + err.message; }
  });
  document.getElementById('save').addEventListener('click', async () => {
    const status = document.getElementById('status');
    status.textContent = 'Сохраняю...';
    try {
      await api('/images', 'POST', { images: { start: urlInput.value.trim() } });
      status.textContent = 'Сохранено ✓';
      tg?.HapticFeedback?.notificationOccurred('success');
    } catch (e) { status.textContent = 'Ошибка: ' + e.message; }
  });
}

// ---------------- BROADCAST ----------------
async function renderBroadcast() {
  app.innerHTML = `<div class="screen">${backRow('Рассылка')}
    <div class="hint">Сообщение уйдёт всем, кто хотя бы раз запускал бота.</div>
    <label>Текст рассылки</label>
    <textarea id="bText" placeholder="Например: новая коллекция подарков уже в боте!"></textarea>
    <label>Картинка (необязательно, URL)</label>
    <input type="text" id="bImg" placeholder="https://...">
    <div class="row"><button class="btn btn-save" id="send">📢 Отправить всем</button></div>
    <div class="status" id="status"></div>
    <div id="progressBox"></div>
    </div>`;
  wireBack();

  async function poll() {
    try {
      const { broadcast } = await api('/broadcast/status');
      const box = document.getElementById('progressBox');
      if (broadcast) {
        box.innerHTML = `<div class="note">Последняя рассылка: ${broadcast.sent_ok} доставлено, ` +
          `${broadcast.sent_fail} с ошибкой, из ${broadcast.total}. Статус: ${broadcast.status === 'done' ? 'завершена' : 'идёт...'}</div>`;
        if (broadcast.status !== 'done') setTimeout(poll, 1500);
      }
    } catch (e) {}
  }
  poll();

  document.getElementById('send').addEventListener('click', async () => {
    const status = document.getElementById('status');
    const text = document.getElementById('bText').value.trim();
    if (!text) { status.textContent = 'Введите текст рассылки'; return; }
    status.textContent = 'Запускаю...';
    try {
      const res = await api('/broadcast', 'POST', {
        text, image_url: document.getElementById('bImg').value.trim(),
      });
      status.textContent = `Рассылка запущена: ${res.total} получателей`;
      tg?.HapticFeedback?.notificationOccurred('success');
      poll();
    } catch (e) { status.textContent = 'Ошибка: ' + e.message; }
  });
}

// ---------------- REFERRALS ----------------
async function renderReferrals() {
  app.innerHTML = `<div class="screen">${backRow('Рефералы')}
    <div class="hint">Процент от суммы заказа, который получает пригласивший. Пользователи узнают ссылку через /ref в боте.</div>
    <label>Процент реферала, %</label>
    <input type="number" id="rPercent" min="0" max="100" step="1">
    <div class="row"><button class="btn btn-save" id="save">Сохранить</button></div>
    <div class="status" id="status"></div>
    <label>Топ рефереров</label>
    <div id="topList"></div>
    </div>`;
  wireBack();
  const data = await api('/referrals');
  document.getElementById('rPercent').value = data.referral_percent;
  const list = document.getElementById('topList');
  if (!data.top.length) {
    list.innerHTML = '<div class="hint">Пока нет начислений.</div>';
  } else {
    list.innerHTML = data.top.map(t =>
      `<div class="list-row"><span>ID ${t.referrer_id} · ${t.orders} заказ(ов)</span><b>${t.earned}</b></div>`
    ).join('');
  }
  document.getElementById('save').addEventListener('click', async () => {
    const status = document.getElementById('status');
    status.textContent = 'Сохраняю...';
    try {
      await api('/referrals', 'POST', { referral_percent: Number(document.getElementById('rPercent').value) });
      status.textContent = 'Сохранено ✓';
      tg?.HapticFeedback?.notificationOccurred('success');
    } catch (e) { status.textContent = 'Ошибка: ' + e.message; }
  });
}

// ---------------- PRICING (markup) ----------------
async function renderPricing() {
  app.innerHTML = `<div class="screen">${backRow('Наценки')}
    <div class="hint">Наценка сверх базовой цены товара. Итоговая цена пересчитывается сразу.</div>
    <label>Наценка, %</label>
    <input type="number" id="mPercent" min="0" max="500" step="1">
    <div class="note" id="finalPrice"></div>
    <div class="row"><button class="btn btn-save" id="save">Сохранить</button></div>
    <div class="status" id="status"></div></div>`;
  wireBack();
  const data = await api('/pricing');
  document.getElementById('mPercent').value = data.markup_percent;
  const finalBox = document.getElementById('finalPrice');
  finalBox.textContent = `Базовая цена: ${data.base_price} ${data.asset} → итоговая: ${data.final_price} ${data.asset}`;
  document.getElementById('save').addEventListener('click', async () => {
    const status = document.getElementById('status');
    status.textContent = 'Сохраняю...';
    try {
      const res = await api('/pricing', 'POST', { markup_percent: Number(document.getElementById('mPercent').value) });
      status.textContent = 'Сохранено ✓ Новая цена: ' + res.final_price + ' ' + data.asset;
      tg?.HapticFeedback?.notificationOccurred('success');
    } catch (e) { status.textContent = 'Ошибка: ' + e.message; }
  });
}

// ---------------- DISCOUNT ----------------
async function renderDiscount() {
  app.innerHTML = `<div class="screen">${backRow('Скидки')}
    <div class="hint">Скидка применяется после наценки, ко всем покупателям.</div>
    <label>Скидка, %</label>
    <input type="number" id="dPercent" min="0" max="95" step="1">
    <div class="note" id="finalPrice"></div>
    <div class="row"><button class="btn btn-save" id="save">Сохранить</button></div>
    <div class="status" id="status"></div></div>`;
  wireBack();
  const data = await api('/pricing');
  document.getElementById('dPercent').value = data.discount_percent;
  document.getElementById('finalPrice').textContent = `Итоговая цена сейчас: ${data.final_price} ${data.asset}`;
  document.getElementById('save').addEventListener('click', async () => {
    const status = document.getElementById('status');
    status.textContent = 'Сохраняю...';
    try {
      const res = await api('/pricing', 'POST', { discount_percent: Number(document.getElementById('dPercent').value) });
      status.textContent = 'Сохранено ✓ Новая цена: ' + res.final_price + ' ' + data.asset;
      tg?.HapticFeedback?.notificationOccurred('success');
    } catch (e) { status.textContent = 'Ошибка: ' + e.message; }
  });
}

// ---------------- REQUIRED CHANNEL ----------------
async function renderChannel() {
  app.innerHTML = `<div class="screen">${backRow('Обязательный канал')}
    <div class="hint">Если задано, бот попросит подписаться на канал перед покупкой. Бот должен быть админом канала, чтобы проверять подписку. Оставьте пустым, чтобы отключить.</div>
    <label>@username канала</label>
    <input type="text" id="chUsername" placeholder="@my_channel">
    <div class="row"><button class="btn btn-save" id="save">Сохранить</button></div>
    <div class="status" id="status"></div></div>`;
  wireBack();
  const data = await api('/required_channel');
  document.getElementById('chUsername').value = data.required_channel || '';
  document.getElementById('save').addEventListener('click', async () => {
    const status = document.getElementById('status');
    status.textContent = 'Сохраняю...';
    try {
      await api('/required_channel', 'POST', { required_channel: document.getElementById('chUsername').value.trim() });
      status.textContent = 'Сохранено ✓';
      tg?.HapticFeedback?.notificationOccurred('success');
    } catch (e) { status.textContent = 'Ошибка: ' + e.message; }
  });
}

// ---------------- STATS ----------------
async function renderStats() {
  app.innerHTML = `<div class="screen"><h1 style="margin-top:14px;">Статистика</h1>
    <div class="hint">Заказы и продажи за последнюю неделю.</div>
    <div class="stat-grid" id="statGrid"></div>
    <label>Отправлено подарков по дням</label>
    <div id="chart"></div></div>`;
  const data = await api('/stats');
  document.getElementById('statGrid').innerHTML = `
    <div class="stat-card"><div class="stat-num">${data.users_count}</div><div class="stat-label">Пользователей</div></div>
    <div class="stat-card"><div class="stat-num">${data.revenue}</div><div class="stat-label">Выручка</div></div>
    <div class="stat-card"><div class="stat-num">${data.orders.sent}</div><div class="stat-label">Отправлено</div></div>
    <div class="stat-card"><div class="stat-num">${data.orders.pending}</div><div class="stat-label">Ожидают оплаты</div></div>
  `;
  const max = Math.max(1, ...data.by_day.map(d => d.count));
  document.getElementById('chart').innerHTML = data.by_day.map(d => `
    <div class="bar-row"><span style="width:36px;">${d.day}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${(d.count / max) * 100}%"></div></div>
      <span>${d.count}</span></div>
  `).join('');
}

// ---------------- WITHDRAW ----------------
async function renderWithdraw() {
  app.innerHTML = `<div class="screen"><h1 style="margin-top:14px;">Вывод средств</h1>
    <div class="hint">Заявка на вывод придёт администратору в чат с ботом — перевод в CryptoBot делается вручную.</div>
    <div class="stat-card" style="margin-bottom:16px;"><div class="stat-num" id="balanceNum">...</div><div class="stat-label">Баланс (выручка от отправленных заказов)</div></div>
    <label>Сумма</label>
    <input type="text" id="wAmount" placeholder="0.00">
    <label>Адрес / @username в CryptoBot</label>
    <input type="text" id="wAddress" placeholder="@your_cryptobot_username">
    <div class="row"><button class="btn btn-save" id="send">Запросить вывод</button></div>
    <div class="status" id="status"></div>
    <label>История заявок</label>
    <div id="history"></div></div>`;
  const data = await api('/withdraw');
  document.getElementById('balanceNum').textContent = data.balance + ' ' + data.asset;
  const history = document.getElementById('history');
  history.innerHTML = data.history.length
    ? data.history.map(h => `<div class="list-row"><span>${h.amount} ${h.asset} → ${h.address}</span><b>${h.status === 'done' ? '✓' : '…'}</b></div>`).join('')
    : '<div class="hint">Пока нет заявок.</div>';
  document.getElementById('send').addEventListener('click', async () => {
    const status = document.getElementById('status');
    const amount = document.getElementById('wAmount').value.trim();
    const address = document.getElementById('wAddress').value.trim();
    if (!amount || !address) { status.textContent = 'Заполните сумму и адрес'; return; }
    status.textContent = 'Отправляю заявку...';
    try {
      await api('/withdraw', 'POST', { amount, address });
      status.textContent = 'Заявка отправлена администратору ✓';
      tg?.HapticFeedback?.notificationOccurred('success');
      renderWithdraw();
    } catch (e) { status.textContent = 'Ошибка: ' + e.message; }
  });
}

// ---------------- PROFILE ----------------
async function renderProfile() {
  app.innerHTML = `<div class="screen"><h1 style="margin-top:14px;">Профиль</h1><div id="profileBox" class="loading">Загрузка...</div></div>`;
  try {
    const p = await api('/profile');
    document.getElementById('profileBox').innerHTML = `
      <div class="list-row"><span>Бот</span><b>@${p.bot_username}</b></div>
      <div class="list-row"><span>Администратор</span><b>${p.admin_username ? '@' + p.admin_username : p.admin_id}</b></div>
      <div class="list-row"><span>Аккаунт-отправитель подарков</span><b>${p.userbot_configured ? 'подключён' : 'не настроен'}</b></div>
      <div class="list-row"><span>GIFT_ID</span><b>${p.gift_id_configured ? 'задан' : 'не задан'}</b></div>
    `;
  } catch (e) {
    document.getElementById('profileBox').innerHTML = `<div class="hint">Не удалось загрузить: ${e.message}</div>`;
  }
}

// ---------------- ROUTER ----------------
const SCREENS = {
  texts: renderTexts, buttons: renderButtons, images: renderImages, broadcast: renderBroadcast,
  referrals: renderReferrals, pricing: renderPricing, discount: renderDiscount, channel: renderChannel,
};

async function render() {
  setNav();
  if (currentScreen) { await SCREENS[currentScreen](); return; }
  if (currentTab === 'overview') return renderOverview();
  if (currentTab === 'stats') return renderStats();
  if (currentTab === 'withdraw') return renderWithdraw();
  if (currentTab === 'profile') return renderProfile();
}

if (!tg?.initData && !location.search.includes('dev=1')) {
  app.innerHTML = `<div class="locked">Эта панель открывается только изнутри Telegram — из бота, по кнопке /admin.</div>`;
} else {
  render();
}
</script>
</body>
</html>
